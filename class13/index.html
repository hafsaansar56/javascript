<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>ID Card Generator</title>
    <style>
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Generate ID Card</h2>
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="inputName" placeholder="Enter name">
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="inputRole" placeholder="Your email address" required>
        </div>
        <div class="form-group">
            <label>Phone Number</label>
            <input type="number" id="inputId" placeholder="Your phone number">
        </div>
        <div class="form-group">
            <label>Course Name</label>
            <input type="text" id="inputPhoto" placeholder="Enter your course">
        </div>
        <button onclick="generateCard()">Submit</button>
    </div>

    <div class="card-container" id="idCard">
        <div class="card-header">IDENTITY CARD</div>
        <div class="card-body">
            <img id="cardImg" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSm8DDoLlnzhxYEpe0xEkWx0a4tYu9p-4OFo3SKNQTe_Q&s" alt="">
            <h3 id="cardName">John Doe</h3>
            <p id="cardRole">Software Engineer</p>
            <p><strong>Phone Number:</strong> <span id="cardId">0000</span></p>
            <div class="card-footer">
                Authorized Signature
            </div>
        </div>
    </div>


    <script src="app.js"></script>
</body>
</html>
